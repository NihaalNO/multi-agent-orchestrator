[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tool-orchestrator"
version = "0.1.0"
description = "Permission-aware orchestrator that discovers, routes, executes and reconciles tool calls."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=2.12",
    "httpx2>=2.16",
    "cryptography>=42",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=3.6",
]
# WebAssembly sandbox for the Python tool (plus python.wasm: scripts/fetch_python_wasm.py).
sandbox = [
    "wasmtime>=51",
]
# Groq and Ollama, through their OpenAI-compatible endpoints.
openai-compat = [
    "openai>=3.57",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "google-genai>=3.6",
    "openai>=3.57",
    "wasmtime>=51",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orchestrator.api" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
