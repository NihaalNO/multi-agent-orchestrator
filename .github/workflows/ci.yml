name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Example workflows
        run: python examples/mvp_demo.py

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t multi-tool-orchestrator:ci .
      - name: Refuses to start without its config
        run: |
          # The image expects /config to be mounted; without it the server must exit with a
          # readable error rather than run with no users or grants.
          if docker run --rm -e ORCH_LLM_PROVIDER=rule_based multi-tool-orchestrator:ci > out.txt 2>&1; then
            echo "expected a non-zero exit"; cat out.txt; exit 1
          fi
          cat out.txt
          grep -q "not starting" out.txt
      - name: Smoke test
        run: |
          docker run -d --name orch -p 8000:8000 -e ORCH_LLM_PROVIDER=rule_based             -v "$PWD/config/policy.example.json:/config/policy.json:ro"             -v "$PWD/config/principals.example.json:/config/principals.json:ro"             multi-tool-orchestrator:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/tools)" = "401"
          test "$(docker inspect -f '{{.State.Health.Status}}' orch)" != "unhealthy"
      - name: Container logs
        if: always()
        run: docker logs orch || true
